# ═══════════════════════════════════════════════════════════════════
# neilcatton.com — Netlify configuration
#
# The site is generated. `npm run build` turns src/ into dist/; Netlify
# runs that on every deploy, so the generated HTML is not committed and
# the "N years in technology" figure recalculates itself rather than
# going stale on 1 January.
# ═══════════════════════════════════════════════════════════════════

# The functions are bundled from netlify/functions and resolve their imports
# against package.json. generate-plan.mjs imports @anthropic-ai/sdk, which
# must therefore stay in "dependencies" — dropping it does not fail the build,
# it returns 502 at request time. package.json must also NOT declare
# "type": "module": three of the functions are CommonJS.
[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"
  # playwright and axe-core are devDependencies used only by tools/check-*.mjs.
  # Netlify installs devDependencies before running the build, and playwright's
  # postinstall would otherwise download a browser on every deploy.
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD = "1"

[functions]
  # generate-plan.mjs reads netlify/functions/lib/practice-corpus.json via
  # fs.readFileSync at runtime rather than a static import, so esbuild's
  # dependency scan won't pick it up on its own — it has to be listed here
  # explicitly or the deployed function 404s trying to read a file that
  # never made it into the bundle.
  included_files = ["netlify/functions/lib/*.json"]

# ── Function routes ──
# The old _redirects file also mapped /substack-feed, straight through to
# neilcatton.substack.com. Two live rules for one path is a trap; that file
# has been removed and this is now the only definition.

[[redirects]]
  from = "/substack-feed"
  to = "/.netlify/functions/substack-feed"
  status = 200
  force = true

[[redirects]]
  from = "/practice-library-feed"
  to = "/.netlify/functions/practice-library-feed"
  status = 200
  force = true

[[redirects]]
  from = "/search-feed"
  to = "/.netlify/functions/search-feed"
  status = 200
  force = true

# generate-plan.mjs calls Claude twice per request via paid AI Gateway
# credits, so this route carries Netlify's native rate limiting rather than
# a bare redirect — 6 requests per IP per 60 seconds. That's generous enough
# for a genuine reader plus a couple of "different angle" regenerations, but
# stops a script from running the meter up. Deliberately routed through this
# redirect (rather than the function's own path) since rate_limit is a
# redirects-only feature — see the note at the top of generate-plan.mjs.
[[redirects]]
  from = "/generate-plan"
  to = "/.netlify/functions/generate-plan"
  status = 200
  force = true

  [redirects.rate_limit]
    window_limit = 6
    window_size = 60
    aggregate_by = ["ip", "domain"]
    action = "rewrite"
    to = "/rate-limited.html"

# ── Security headers ──
#
# script-src and style-src no longer need 'unsafe-inline'. Every page's
# CSS and JavaScript is an external file under /assets now, including the
# per-page blocks, which the old single-file-per-page structure made
# impossible. That was recorded in this file as a known limitation; it is
# closed.
#
# This exact policy was tested locally against every built page before it
# was written here: nothing was blocked, both scripts ran, the stylesheet
# and the self-hosted fonts applied, and all 109 application/ld+json
# blocks parsed. (JSON-LD is data rather than executable script, so
# script-src does not apply to it — but that was verified rather than
# assumed.) Re-run it after any CSP change:  node tools/probe-csp.mjs
#
# Note that style-src 'self' also blocks style="" attributes, not just
# inline <style> blocks. The site has none; if you add one, this policy
# will silently drop the styling. Use a class.
#
# Removed from connect-src: corsproxy.io and api.rss2json.com. Those were
# fallback paths for the Substack feed. They routed reader requests, and
# Neil's own content, through two third parties in a position to modify
# what came back — for a failure case the site's own Netlify function and
# the direct Substack API already cover.
#
# Removed entirely: fonts.googleapis.com and fonts.gstatic.com. Both
# families are self-hosted under /assets/fonts now, so no visitor request
# reaches Google and nothing external blocks the render.
#
# img-src still allows https: because the Practice Library card thumbnails
# come from substackcdn.com and change as cards are published.

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://plausible.io; style-src 'self'; font-src 'self'; img-src 'self' data: https:; connect-src 'self' https://formspree.io https://plausible.io https://writing.neilcatton.com; frame-src https://writing.neilcatton.com; form-action 'self' https://formspree.io; base-uri 'self'; object-src 'none'; frame-ancestors 'self'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    X-Frame-Options = "SAMEORIGIN"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Cross-Origin-Opener-Policy = "same-origin"

# ── Cache lifetimes ──
# HTML stays on Netlify's short default: content changes without the
# filename changing. Everything under /assets is a shared file now rather
# than markup inlined into every page, so it is worth caching properly —
# though not immutably, since site.css keeps its name across edits.

[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/downloads/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/favicon.ico"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/apple-touch-icon.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/.well-known/security.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

[[headers]]
  for = "/briefings.xml"
  [headers.values]
    Content-Type = "application/rss+xml; charset=utf-8"
    Cache-Control = "public, max-age=3600"
