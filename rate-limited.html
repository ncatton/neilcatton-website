<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Please wait a moment — Neil Catton</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<style>
  :root {
    --ink: #1a1714; --paper: #f5f2ee; --accent: #2b4a6f; --rule: #d4cfc9;
    --serif: "Playfair Display", Georgia, serif;
    --sans: "Source Sans 3", Helvetica, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #f5f2ee; color: #1a1714; font-family: var(--sans);
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 2rem; line-height: 1.7;
  }
  .wrap { max-width: 480px; text-align: center; }
  h1 {
    font-family: var(--serif); font-weight: 400; font-size: 1.8rem;
    margin-bottom: 1rem; line-height: 1.3;
  }
  p { font-size: 1rem; color: #3d3935; margin-bottom: 1.75rem; }
  a.btn {
    display: inline-flex; align-items: center; justify-content: center;
    font-family: var(--sans); font-size: 0.72rem; font-weight: 600;
    letter-spacing: 0.1em; text-transform: uppercase; text-decoration: none;
    padding: 0.875rem 1.75rem; min-height: 44px;
    background: #1a1714; color: #f5f2ee; border: 2px solid #1a1714;
    transition: all 0.2s;
  }
  a.btn:hover { background: #2b4a6f; border-color: #2b4a6f; }
</style>
</head>
<body>
  <div class="wrap">
    <h1>A moment, please.</h1>
    <p>
      This page has had a lot of requests in a short space of time, so it's
      pausing briefly rather than letting them all through at once. Nothing's
      wrong on your end — give it a minute and try again.
    </p>
    <a class="btn" href="/personalised-plan.html">Back to Your Plan</a>
  </div>
</body>
</html>
